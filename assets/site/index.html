<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>时光手帐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Long+Cang&family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#e0bd7e; --gold-dim:rgba(224,189,126,.38);
  --ink:#f3eadb; --muted:rgba(243,234,219,.6); --faint:rgba(243,234,219,.32);
  --line:rgba(224,189,126,.26); --bg:#060508; --paper:#f4ede0; --paper-ink:#2b2219;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --serif:'Noto Serif SC','Songti SC',serif;
  --hand:'Long Cang','Kaiti SC',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--serif);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;display:none}
[data-theme=light] #sky{display:block}
[data-theme=light] body{background:#f3e7df}
[data-theme=light] canvas#gl{filter:saturate(1.06) contrast(1.03)}
#sky .base{position:absolute;inset:-10%;background:linear-gradient(160deg,#fde4d4 0%,#f8d3e0 28%,#ddd5f6 55%,#cde8f4 78%,#e0f3e2 100%);animation:skyShift 30s ease-in-out infinite alternate}
@keyframes skyShift{to{transform:translate(-3%,2%) rotate(2deg) scale(1.05)}}
#sky .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(var(--mx),var(--my)) scale(1.15)}}
#sky .leak{position:absolute;inset:0;mix-blend-mode:screen;animation:leak 9s ease-in-out infinite alternate;
  background:radial-gradient(circle at 92% 8%,rgba(255,168,88,.75),transparent 34%),radial-gradient(circle at 4% 92%,rgba(255,120,160,.45),transparent 40%),radial-gradient(ellipse at 50% -10%,rgba(255,250,235,.7),transparent 50%)}
@keyframes leak{0%{opacity:.65}50%{opacity:1}100%{opacity:.75}}
#sky .bokeh{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.9),rgba(255,255,255,.25) 60%,rgba(255,255,255,0) 72%);
  box-shadow:0 0 0 1px rgba(255,255,255,.35);animation:bokeh linear infinite;opacity:0}
@keyframes bokeh{0%{opacity:0;transform:translateY(0)}15%{opacity:var(--o)}85%{opacity:var(--o)}100%{opacity:0;transform:translateY(-30vh)}}
[data-theme=light]{--gold:#b97a43;--gold-dim:rgba(185,122,67,.4);--ink:#4a3328;--muted:rgba(74,51,40,.66);--faint:rgba(74,51,40,.42);--line:rgba(160,108,70,.32);--bg:#f3e7df}
[data-theme=light] .vignette{background:radial-gradient(ellipse at center,transparent 50%,rgba(150,100,70,.22) 100%)}
[data-theme=light] #intro h1,[data-theme=light] .yi-year,[data-theme=light] #panoHint b{text-shadow:0 0 40px rgba(255,255,255,.9),0 2px 20px rgba(255,200,170,.6)}
[data-theme=light] #fDate{text-shadow:0 1px 10px rgba(255,255,255,.9)}
[data-theme=light] #fade{background:#f3e7df}
[data-theme=light] #detail.open .scrim{background:rgba(248,236,226,.7)}
[data-theme=light] #book{background:radial-gradient(ellipse at 50% 58%,rgba(255,240,226,.93),rgba(236,214,200,.97) 72%)}
/* music player */
.player{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(10,10,14,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:min(330px,42vw)}
.player .eq{display:flex;align-items:flex-end;gap:2px;height:12px;width:14px}
.player .eq i{display:block;width:3px;height:30%;background:var(--gold);border-radius:1px}
.player.playing .eq i{animation:eq .9s ease-in-out infinite}
.player.playing .eq i:nth-child(2){animation-delay:-.3s}.player.playing .eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.player .pt{font-size:12px;letter-spacing:.08em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.player button,.player label{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;flex:none}
.player button:hover,.player label:hover{color:var(--gold)}
.player svg{width:13px;height:13px;fill:currentColor}
.player .pt.miss{color:var(--muted)}
#hud .bar .left{display:flex;align-items:center;gap:14px;min-width:0}
.hidden{display:none!important}
.small{font-size:12px;letter-spacing:.2em;color:var(--muted)}

.grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;z-index:60;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .9s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-4%)}60%{transform:translate(-4%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:59;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.6) 100%)}
#flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#fffaf0,#ffe9c4 60%,#f5c98a);opacity:0;pointer-events:none;z-index:70;transition:opacity .35s ease-in}
#flash.on{opacity:1}
#fade{position:fixed;inset:0;background:#060508;opacity:0;pointer-events:none;z-index:72;transition:opacity .55s ease}
#fade.on{opacity:1}
.brand.link{cursor:pointer}

.btn{position:relative;padding:14px 38px;border:1px solid var(--gold-dim);border-radius:2px;font-family:var(--serif);font-size:15px;letter-spacing:.32em;color:#1a140c;background:linear-gradient(180deg,#f3e3c3,#d9b77a);transition:all .3s}
.btn:hover{box-shadow:0 0 40px rgba(224,189,126,.45);transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:progress}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;letter-spacing:.08em;color:var(--ink);background:rgba(10,10,14,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .25s;white-space:nowrap}
.chip:hover{border-color:var(--gold);color:#fff}
.chip.active{border-color:var(--gold);color:var(--gold)}
.bar{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;z-index:30;gap:10px}
.brand{font-size:14px;letter-spacing:.35em;color:var(--ink);white-space:nowrap}
.brand i{color:var(--gold);font-style:normal;margin-right:8px}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;pointer-events:none}
#intro > *{pointer-events:auto}
.kicker{display:flex;align-items:center;gap:14px}
.kicker::before,.kicker::after{content:"";width:48px;height:1px;background:var(--line)}
#intro h1{font-weight:300;font-size:clamp(34px,6vw,66px);letter-spacing:.34em;margin:18px 0 30px;padding-left:.34em;text-shadow:0 0 50px rgba(224,189,126,.35),0 2px 30px rgba(0,0,0,.8)}
.panel{padding:26px 28px 24px;border:1px solid rgba(255,255,255,.08);background:rgba(8,8,12,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:4px;max-width:600px;width:100%}
.clock{display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--mono);font-size:clamp(26px,6.4vw,44px);color:var(--ink)}
.cell{position:relative;width:1.05em;height:1.45em;display:flex;align-items:center;justify-content:center;border-radius:6px;overflow:hidden;background:linear-gradient(180deg,#1f1e24 0%,#17161b 50%,#111015 50%,#0c0b0f 100%);box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.06)}
.cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.6)}
.cell b{font-weight:500;display:block}
.cell.tick b{animation:flip .14s ease-out}
@keyframes flip{from{transform:translateY(-35%) scaleY(.6);opacity:.2;filter:blur(2px)}}
.clock .dot{font-style:normal;color:var(--gold);margin:0 2px}
.clock-label{margin-top:14px;transition:color .4s}
.years{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:26px auto 14px}
.years button{font-family:var(--mono);font-size:13px;letter-spacing:.1em;padding:7px 11px;border:1px solid var(--line);border-radius:2px;color:var(--muted);transition:all .2s}
.years button:hover{color:var(--ink);border-color:var(--gold-dim)}
.years button.on{color:#16110a;background:var(--gold);border-color:var(--gold)}
.dest{margin:26px 0 22px}
.intro-foot{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:11px;color:var(--faint);letter-spacing:.15em}
#intro .fade{transition:opacity .7s,transform .7s}
#intro.warping .fade{opacity:0;transform:translateY(14px);pointer-events:none}
#intro.warping .panel{background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;transition:all .6s}
#intro.warping .clock-label{color:var(--gold)}
#intro.gone{opacity:0;transition:opacity .4s}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity 1.4s .3s}
#hud.show{opacity:1}
#hud .bar{position:absolute}
#hud .bar > *, #ruler{pointer-events:auto}
.hud-actions{display:flex;gap:8px;align-items:center}
.modes{display:flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:rgba(10,10,14,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modes button{padding:6px 14px;border-radius:999px;font-size:13px;letter-spacing:.1em;color:var(--muted);transition:all .3s;white-space:nowrap}
.modes button:hover{color:var(--ink)}
.modes button.on{background:var(--gold);color:#1a140c}
#ruler{position:absolute;left:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;transition:opacity .6s}
#ruler button{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.15em;color:var(--faint);padding:4px 0;transition:color .3s}
#ruler button::before{content:"";width:14px;height:1px;background:currentColor;transition:width .3s}
#ruler button:hover{color:var(--ink)}
#ruler button.on{color:var(--gold)}
#ruler button.on::before{width:34px}
.yearinfo{position:absolute;left:24px;bottom:26px;transition:opacity .6s}
.yi-year{font-family:var(--serif);font-weight:300;font-size:clamp(52px,8vw,96px);line-height:1;letter-spacing:.04em;margin:6px 0 8px;color:var(--ink);text-shadow:0 0 50px rgba(224,189,126,.35)}
.yi-line{font-size:13px;letter-spacing:.12em;color:var(--muted)}
.swap{animation:swap .7s ease-out}
@keyframes swap{from{opacity:0;transform:translateY(10px)}}
.focus{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);text-align:center;width:min(520px,60vw);transition:opacity .6s}
#fDate{color:var(--ink);font-size:14px;letter-spacing:.15em;margin-bottom:8px;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.f-hint{font-size:11px;color:var(--faint);letter-spacing:.2em}
#panoHint{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);text-align:center;transition:opacity .6s;pointer-events:none;width:min(600px,92vw)}
#panoHint b{display:block;font-weight:300;font-size:clamp(20px,2.6vw,30px);letter-spacing:.3em;margin-bottom:10px;color:var(--ink);text-shadow:0 0 30px rgba(224,189,126,.4),0 2px 16px #000}
#hud.pano .focus,#hud.pano .yearinfo,#hud.pano .zoomctl{opacity:0;pointer-events:none}
.zoomctl{position:absolute;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto;transition:opacity .6s;
  padding:10px 6px;border:1px solid var(--line);border-radius:999px;background:rgba(10,10,14,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.zoomctl button{width:28px;height:28px;border-radius:50%;color:var(--ink);font-size:16px;line-height:1}
.zoomctl button:hover{color:var(--gold)}
.zoomctl input{writing-mode:vertical-lr;direction:rtl;width:4px;height:120px;accent-color:var(--gold);cursor:pointer}
#hud.pano.hl .yearinfo{opacity:1}
#hud.pano.hl #panoHint{opacity:0}
#hud.helix #panoHint{opacity:0}

/* ---------- detail ---------- */
#detail{position:fixed;inset:0;z-index:50}
#detail .scrim{position:absolute;inset:0;background:rgba(4,4,7,0);transition:all .6s}
#detail.open .scrim{background:rgba(4,4,7,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dcard{position:fixed;perspective:1600px;transform-origin:50% 50%;transition:transform .75s cubic-bezier(.2,.85,.25,1);cursor:pointer}
.dinner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.dcard.flipped .dinner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);color:var(--paper-ink);border-radius:3px;box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.08)}
.face.front{padding:18px 18px 0}
.face.front .photo{width:100%;overflow:hidden;background:#222}
.face.front img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(var(--sep,0)) contrast(1.03)}
.face.front .hand{height:70px;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:28px;color:#3a2c1e;transform:rotate(-1.2deg)}
.face.back{transform:rotateY(180deg);padding:30px 32px;display:flex;flex-direction:column;background:repeating-linear-gradient(180deg,transparent 0 33px,rgba(120,90,60,.13) 33px 34px),var(--paper)}
.dmeta{font-size:12px;letter-spacing:.2em;color:#8a6a45}
.dplace{font-size:13px;color:#7d6550;margin-top:8px;letter-spacing:.1em}
.dtext{font-family:var(--hand);font-size:clamp(22px,2.6vw,27px);line-height:34px;margin-top:22px;flex:1;overflow:auto;color:#2f241a}
.dtags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 12px}
.dtags span{font-size:12px;padding:3px 10px;border:1px solid rgba(138,106,69,.4);border-radius:999px;color:#7d6550}
.dsign{font-size:12px;letter-spacing:.15em;color:#8a6a45;text-align:right}
.dnav{position:fixed;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:8px;opacity:0;transform:translateY(10px);transition:all .5s .2s;padding:0 16px;flex-wrap:wrap}
#detail.open .dnav{opacity:1;transform:none}
.stamp{position:absolute;right:22px;top:22px;width:62px;height:62px;border:2px solid rgba(178,74,52,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:rgba(178,74,52,.75);transform:rotate(12deg);text-align:center;line-height:1.3}

/* ---------- book of answers ---------- */
#book{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:74px 16px 22px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 60%,rgba(52,34,18,.92),rgba(8,6,5,.97) 70%);opacity:0;transition:opacity .7s}
#book.show{opacity:1}
.bk-glow{position:absolute;left:50%;top:56%;width:min(1200px,150vw);aspect-ratio:1.7;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(255,196,120,.26),rgba(255,160,80,.08) 38%,transparent 66%);animation:flicker 5s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:.85}22%{opacity:1}48%{opacity:.72}70%{opacity:.95}86%{opacity:.8}}
.dust{position:absolute;inset:0;pointer-events:none}
.dust i{position:absolute;bottom:18%;width:2px;height:2px;border-radius:50%;background:#ffdca0;box-shadow:0 0 6px #ffcf80;opacity:0;animation:dust linear infinite}
@keyframes dust{0%{opacity:0;transform:translate(0,0)}15%{opacity:.85}100%{opacity:0;transform:translate(var(--dx),-55vh)}}
.bk-head{position:relative;text-align:center}
.bk-head h2{font-weight:300;font-size:clamp(24px,3.4vw,36px);letter-spacing:.5em;padding-left:.5em;
  background:linear-gradient(110deg,#b8914f,#f7e2a8 40%,#cf9f52 55%,#fff1c9 62%,#b8914f 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s linear infinite}
@keyframes sheen{from{background-position:120% 0}to{background-position:-130% 0}}
.bk-head p{margin-top:10px;font-size:14px;letter-spacing:.2em;color:var(--muted);min-height:1.4em;transition:opacity .4s}
.bk-stage{position:relative;perspective:2600px;perspective-origin:50% 20%;margin-top:18px}
.bk{position:relative;width:calc(var(--pw)*2);height:var(--ph);transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.3,.7,.2,1);transform:translateX(calc(var(--pw)*-.5)) rotateX(16deg)}
.bk.open{transform:translateX(0) rotateX(16deg)}
.bk::after{content:"";position:absolute;left:calc(var(--pw)*.4);right:calc(var(--pw)*.4);bottom:-34px;height:40px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.7),transparent 70%);transform:translateZ(-30px);transition:all 1.3s}
.bk.open::after{left:-20px;right:-20px}
.leather{background:radial-gradient(circle at 28% 18%,#5a3420,#33190d 55%,#1f0f07);position:relative}
.leather::before{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay;border-radius:inherit;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.3' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.board{position:absolute;top:-11px;height:calc(100% + 22px);left:var(--pw);width:calc(var(--pw) + 13px);border-radius:3px 12px 12px 3px;transform:translateZ(-4px);box-shadow:0 30px 60px rgba(0,0,0,.6)}
.pgs{position:absolute;top:0;height:100%;width:var(--pw)}
.pgs.r{left:var(--pw);border-radius:0 4px 4px 0;box-shadow:1px 0 0 #efe2c8,2px 1px 0 #c9b28a,3px 1px 0 #efe2c8,4px 2px 0 #c2a979,5px 2px 0 #ecdcbd,6px 3px 0 #b99d6b,7px 3px 0 #e6d3af}
.pgs.l{left:0;border-radius:4px 0 0 4px;opacity:0;transition:opacity .2s;box-shadow:-1px 0 0 #efe2c8,-2px 1px 0 #c9b28a,-3px 1px 0 #efe2c8,-4px 2px 0 #c2a979,-5px 2px 0 #ecdcbd,-6px 3px 0 #b99d6b,-7px 3px 0 #e6d3af}
.bk.read .pgs.l{opacity:1;transition:opacity .15s}
.pgs.l{transform-origin:100% 50%;transform:translateZ(1px)}
.paper{background:repeating-linear-gradient(180deg,transparent 0 29px,rgba(130,95,60,.09) 29px 30px),radial-gradient(ellipse at 50% 40%,#f6eddb,#ecdfc4 85%);color:#2f241a}
.paper.rp::before,.paper.lp::before{content:"";position:absolute;top:0;bottom:0;width:16%;pointer-events:none;z-index:2}
.paper.rp::before{left:0;background:linear-gradient(90deg,rgba(60,35,10,.28),rgba(60,35,10,.06) 40%,transparent)}
.paper.lp::before{right:0;background:linear-gradient(270deg,rgba(60,35,10,.28),rgba(60,35,10,.06) 40%,transparent)}
.ribbon{position:absolute;top:55%;left:calc(var(--pw) + 26px);width:12px;height:calc(var(--ph)*.45 + 52px);transform:translateZ(-1px);opacity:0;transition:opacity .4s 1s;
  background:linear-gradient(90deg,#6d1717,#b3352d 45%,#7d1d1a);clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 11px),0 100%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.bk.open .ribbon{opacity:1}
.leaf{position:absolute;top:0;left:var(--pw);width:var(--pw);height:100%;transform-origin:0 50%;transform-style:preserve-3d}
.seg{position:absolute;top:0;height:100%;transform-style:preserve-3d}
.s1{left:0;width:calc(50% + 1px)}
.s2{left:calc(var(--pw)*.5);width:calc(var(--pw)*.5);transform-origin:0 50%}
.pf{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pf.b{transform:rotateY(180deg)}
.pc{position:absolute;top:0;width:var(--pw);height:100%}
.pf .sh{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:5}
.s1 > .pf > .sh{background:linear-gradient(90deg,rgba(40,20,0,.32),rgba(40,20,0,.05))}
.s2 > .pf > .sh{background:linear-gradient(90deg,rgba(40,20,0,.05),rgba(40,20,0,.38))}
.leaf.turning .sh{animation:shade var(--dur,.6s) ease-in-out}
@keyframes shade{50%{opacity:1}}
/* cover */
.cover{top:-11px;height:calc(100% + 22px);width:calc(var(--pw) + 13px)}
.cover .pf{border-radius:3px 12px 12px 3px}
.cover .pf.b{border-radius:12px 3px 3px 12px}
.cv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5%;color:#e7c88a;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.cv svg.frame{position:absolute;inset:0;width:100%;height:100%}
.cv .emb{width:44%;filter:drop-shadow(0 0 12px rgba(240,200,120,.35))}
.foil{position:relative;font-weight:500;font-size:calc(var(--pw)*.105);letter-spacing:.45em;padding-left:.45em;
  background:linear-gradient(110deg,#a8803f,#f7e2a8 40%,#c99a4c 55%,#fff1c9 62%,#a8803f 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s linear infinite;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.cv small{position:relative;font-size:calc(var(--pw)*.034);letter-spacing:.6em;padding-left:.6em;color:rgba(231,200,138,.7)}
.inside{background:linear-gradient(90deg,#2a160b,#3a1f10);box-shadow:inset 0 0 0 9px #2a160b}
.inside::after{content:"";position:absolute;inset:12px;border-radius:2px;background:radial-gradient(circle at 30% 30%,rgba(160,110,50,.18) 0 1.5px,transparent 2px) 0 0/14px 14px,linear-gradient(135deg,#e7d3ad,#d8bf92)}
/* page contents */
.pno{position:absolute;bottom:14px;font-size:11px;letter-spacing:.2em;color:rgba(100,75,50,.55);z-index:3}
.rp .pno{right:18px} .lp .pno{left:18px}
.pframe{position:absolute;inset:16px;border:1px solid rgba(150,110,60,.28);box-shadow:inset 0 0 0 4px rgba(246,237,219,.6),inset 0 0 0 5px rgba(150,110,60,.18);pointer-events:none;z-index:1}
.snap{position:absolute;padding:5px 5px 20px;background:#fbf7ee;box-shadow:0 4px 12px rgba(60,40,20,.25);z-index:2}
.snap i{display:block;background-size:cover;background-position:center;filter:sepia(.35) contrast(1.02)}
.snap b{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:var(--hand);font-weight:400;font-size:calc(var(--pw)*.035);color:#4a3726}
.tape{position:absolute;width:34%;height:14px;left:33%;top:-7px;background:rgba(232,220,180,.75);box-shadow:0 1px 2px rgba(0,0,0,.12);transform:rotate(-3deg)}
.scrib{position:absolute;left:14%;right:12%;font-family:var(--hand);font-size:calc(var(--pw)*.048);color:rgba(60,40,20,.55);line-height:30px;z-index:2}
.stamp2{position:absolute;width:calc(var(--pw)*.17);aspect-ratio:1;border:1.5px solid rgba(170,70,50,.45);border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--pw)*.026);letter-spacing:.1em;color:rgba(170,70,50,.6);transform:rotate(14deg);text-align:center;line-height:1.3;z-index:2}
.ans-page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14% 13%;text-align:center;z-index:2}
.orn{color:#b48a4a;font-size:calc(var(--pw)*.045);letter-spacing:.6em;padding-left:.6em;opacity:.8}
.ans-q{font-size:calc(var(--pw)*.036);letter-spacing:.14em;color:#8a6a45;margin:6% 0 2%;line-height:1.7}
.ans{font-family:var(--hand);line-height:1.4;color:#2a1a0e;margin:6% 0;white-space:nowrap}
.ans span{display:inline-block;opacity:0}
.ans.ink span{animation:ink .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes ink{from{opacity:0;filter:blur(6px);transform:translateY(5px) scale(1.08)}to{opacity:1;filter:none;transform:none}}
.ans-from{font-size:calc(var(--pw)*.034);letter-spacing:.12em;color:#7d6550;line-height:1.8;opacity:0;transition:opacity 1s}
.ans-from.on{opacity:1}
.ans-hint{font-family:var(--hand);font-size:calc(var(--pw)*.058);color:#8a6a45;line-height:1.7;white-space:nowrap}
.mem-page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5%;z-index:2}
.mem-page .snap{position:relative;width:74%;padding:4% 4% 13%;transform:rotate(-2.5deg)}
.mem-page .snap i{aspect-ratio:4/3}
.mem-page .snap b{font-size:calc(var(--pw)*.058);bottom:3%}
.mem-page .dt{font-size:calc(var(--pw)*.034);letter-spacing:.22em;color:#8a6a45}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff1c9;box-shadow:0 0 10px 3px rgba(255,210,130,.8);pointer-events:none;z-index:50}
.bk-ask{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(520px,100%);margin-top:6px}
.bk-ask input{width:100%;padding:12px 18px;border:0;border-bottom:1px solid rgba(224,189,126,.4);background:transparent;color:var(--ink);font-family:var(--hand);font-size:22px;letter-spacing:.06em;text-align:center;outline:none;transition:border-color .3s}
.bk-ask input::placeholder{font-family:var(--serif);font-size:14px;letter-spacing:.15em;color:rgba(243,234,219,.35)}
.bk-ask input:focus{border-color:var(--gold)}
.bk-ask .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.g-box{width:min(620px,100%);padding:34px 30px 24px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,rgba(24,20,14,.96),rgba(10,9,8,.96));text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.g-box h3{font-weight:500;font-size:24px;letter-spacing:.3em;padding-left:.3em}
.g-sub{color:var(--muted);font-size:14px;margin:10px 0 24px;letter-spacing:.1em}
.g-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.g-card{display:flex;flex-direction:column;align-items:center;gap:8px}
.g-ic{width:100%;aspect-ratio:1;border-radius:10px;border:1px solid rgba(224,189,126,.35);display:flex;align-items:center;justify-content:center;font-size:44px;background:radial-gradient(circle at 50% 40%,rgba(120,90,200,.35),rgba(20,16,30,.9) 70%);filter:saturate(.5) sepia(.5);box-shadow:inset 0 0 30px rgba(224,189,126,.12)}
.g-card b{font-weight:500;font-size:15px;letter-spacing:.15em}
.g-card span{font-size:12px;color:var(--muted);line-height:1.6}
.g-box .btn{width:100%}
.g-actions{display:flex;flex-direction:column;gap:10px;align-items:center}
.g-note{margin-top:14px}
.g-err{color:#ff9b7a;font-size:13px;margin-top:10px;min-height:1em}

@media (max-width:760px){
  .g-grid{grid-template-columns:repeat(2,1fr)}
  #gcam{width:132px;right:10px;bottom:10px}
  .bar{padding:12px 12px}
  .brand{display:none}
  #hud .bar{justify-content:center}
  .modes button{padding:6px 11px;font-size:12px}
  .panel{padding:20px 14px}
  #ruler{left:0;right:0;top:56px;transform:none;flex-direction:row;overflow-x:auto;gap:14px;padding:6px 16px;scrollbar-width:none}
  #ruler::-webkit-scrollbar{display:none}
  #ruler button::before{display:none}
  #ruler button.on{text-decoration:underline;text-underline-offset:6px}
  .yearinfo{left:16px;bottom:20px}
  .focus{left:16px;right:16px;transform:none;width:auto;bottom:auto;top:100px;text-align:left}
  .f-hint{display:none}
  .zoomctl{right:10px;top:auto;bottom:90px;transform:none}
  .zoomctl input{height:80px}
  .chip{padding:7px 11px;font-size:12px}
  .hud-actions .lbl{display:none}
  .player{max-width:150px}
  .player .pt{display:none}
  #hud .bar{justify-content:space-between}
}

/* =====================================================================
   v2 · liquid glass — one material for every control (chips, capsules, panels),
   plus the reworked sky, photo viewer and light effects. Later rules win.
   ===================================================================== */
:root{
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;
  --gold:#f2cf95; --gold-dim:rgba(242,207,149,.4); --ink:#f6f1e8; --muted:rgba(246,241,232,.66); --faint:rgba(246,241,232,.4);
  --line:rgba(255,255,255,.16); --paper:#fbf8f2;
  --g-a:rgba(48,42,48,.44); --g-b:rgba(22,19,23,.36);
  --g-hi:rgba(255,255,255,.66); --g-mid:rgba(255,255,255,.07); --g-lo:rgba(255,255,255,.24);
  --g-in:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -10px 18px -12px rgba(255,255,255,.18);
  --g-drop:0 12px 36px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.25);
  --g-blur:blur(24px) saturate(190%) brightness(.86);
  --spec:rgba(255,255,255,.3); --hover:rgba(255,255,255,.13);
  --thumb:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,.14));
  --thumb-sh:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.14),0 4px 14px rgba(0,0,0,.32);
  --spring:cubic-bezier(.3,1.45,.45,1);
}
[data-theme=light]{
  --gold:#b86f3c; --gold-dim:rgba(184,111,60,.42); --ink:#3b2a22; --muted:rgba(59,42,34,.72); --faint:rgba(59,42,34,.5); --line:rgba(120,80,50,.16); --bg:#f6e3d6;
  --g-a:rgba(255,255,255,.64); --g-b:rgba(255,255,255,.28);
  --g-hi:#fff; --g-mid:rgba(255,255,255,.35); --g-lo:rgba(255,255,255,.85);
  --g-in:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -10px 18px -12px rgba(255,255,255,.75);
  --g-drop:0 14px 38px rgba(160,96,64,.2),0 2px 6px rgba(160,96,64,.12);
  --g-blur:blur(24px) saturate(180%);
  --spec:rgba(255,255,255,.75); --hover:rgba(120,76,44,.1);
  --thumb:linear-gradient(180deg,#fff,rgba(255,255,255,.74));
  --thumb-sh:inset 0 1px 0 #fff,0 4px 14px rgba(160,96,64,.24),0 0 0 .5px rgba(160,96,64,.12);
}
[data-theme=light] body{background:#f6e3d6}
[data-theme=light] #fade{background:#f6e3d6}

/* the glass itself: tinted body, refracted backdrop, bright rim top-left → bottom-right, a highlight that follows the pointer */
.chip,.modes,.player,.zoomctl,.panel,.g-box,.dnav,.btn,.bk-ask input{
  border:0;background:linear-gradient(180deg,var(--g-a),var(--g-b));
  -webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);
  box-shadow:var(--g-drop),var(--g-in)}
.chip,.modes,.player,.panel,.g-box{position:relative}
:is(.chip,.modes,.player,.zoomctl,.panel,.g-box,.dnav,.btn)::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--g-hi),var(--g-mid) 32%,var(--g-mid) 64%,var(--g-lo));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
:is(.chip,.modes,.player,.zoomctl,.panel,.g-box,.dnav,.btn)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(var(--ss,110px) circle at var(--px,50%) var(--py,0%),var(--spec),transparent 68%)}
:is(.chip,.modes,.player,.zoomctl,.panel,.g-box,.dnav,.btn):hover::after{opacity:1}
.ic{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.chip{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:999px;font-family:var(--sans);font-size:13.5px;font-weight:500;letter-spacing:.04em;color:var(--ink);
  transition:transform .45s var(--spring),filter .25s,background .25s}
.chip:hover{color:var(--ink);transform:translateY(-1px) scale(1.04);filter:brightness(1.1)}
.chip:active,.btn:active{transform:scale(.95);transition-duration:.12s}
.chip.active{color:var(--gold)}

/* primary action: amber-tinted glass with a slow sheen */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 44px;border-radius:999px;font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:.26em;text-indent:.26em;color:#fff8ea;text-shadow:0 1px 10px rgba(110,54,0,.55);
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.4) 50%,transparent 58%) 170% 0/260% 100% no-repeat,linear-gradient(180deg,rgba(255,222,164,.5),rgba(228,158,76,.26));
  box-shadow:0 14px 44px rgba(240,168,78,.3),0 2px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -12px 20px -12px rgba(255,196,120,.6);
  animation:btnSheen 5s ease-in-out infinite;transition:transform .45s var(--spring),box-shadow .35s,filter .3s}
@keyframes btnSheen{0%,55%{background-position:170% 0,0 0}100%{background-position:-70% 0,0 0}}
.btn:hover{transform:translateY(-2px) scale(1.035);filter:brightness(1.08);box-shadow:0 20px 60px rgba(240,168,78,.5),0 2px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -12px 20px -12px rgba(255,196,120,.7)}
.btn:disabled{opacity:.65;cursor:progress;animation:none}
[data-theme=light] .btn{color:#5a3013;text-shadow:0 1px 0 rgba(255,255,255,.6);
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.75) 50%,transparent 58%) 170% 0/260% 100% no-repeat,linear-gradient(180deg,rgba(255,244,226,.9),rgba(255,198,140,.6));
  box-shadow:0 14px 40px rgba(226,132,70,.3),0 2px 6px rgba(160,96,64,.14),inset 0 1px 0 #fff,inset 0 -12px 20px -12px rgba(255,170,100,.55)}

.bar{padding:16px 22px}
.brand{font-size:15px;letter-spacing:.3em}
.small,.intro-foot,.yi-line,.f-hint,#fDate,.dmeta,.dplace,.dsign,.g-sub,.g-card span,.bk-head p{font-family:var(--sans)}
.small{letter-spacing:.24em}
.hud-actions{gap:10px}

/* music capsule */
.player{height:40px;padding:0 6px 0 14px;gap:3px}
.player button,.player label{width:30px;height:30px;transition:background .2s,transform .35s var(--spring)}
.player button:hover,.player label:hover{color:var(--ink);background:var(--hover);transform:scale(1.1)}

/* segmented control with a sliding glass thumb */
.modes{height:40px;padding:4px;align-items:center}
.modes .thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--thumb);box-shadow:var(--thumb-sh);
  transform:translateX(var(--tx,0));transition:transform .55s var(--spring),width .4s ease}
.modes button{position:relative;z-index:1;height:32px;padding:0 16px;font-family:var(--sans);font-size:13.5px;font-weight:500;letter-spacing:.06em;color:var(--muted)}
.modes button.on{background:none;color:var(--ink)}
[data-theme=light] .modes button.on{color:#2e1f18}

/* intro */
#intro h1{margin:20px 0 34px}
.panel{padding:34px 36px 32px;border-radius:36px;max-width:560px;--ss:420px;--spec:rgba(255,255,255,.1)}
[data-theme=light] .panel{--spec:rgba(255,255,255,.5)}
.panel::before{transition:opacity .6s}
#intro.warping .panel{box-shadow:none}
#intro.warping .panel::before,#intro.warping .panel::after{opacity:0}
.clock{gap:7px}
.cell{width:1.08em;height:1.5em;border-radius:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.06) 49.6%,rgba(0,0,0,.22) 50.4%,rgba(255,255,255,.05));
  box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.09);
  -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.cell::after{background:rgba(0,0,0,.35);box-shadow:0 1px 0 rgba(255,255,255,.1)}
[data-theme=light] .cell{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.62) 49.6%,rgba(214,176,150,.3) 50.4%,rgba(255,255,255,.55));
  box-shadow:0 10px 22px rgba(160,96,64,.18),inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.7)}
[data-theme=light] .cell::after{background:rgba(150,100,70,.22);box-shadow:0 1px 0 rgba(255,255,255,.8)}
.dest{margin:24px 0 24px}

/* HUD */
#ruler button{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.12em;padding:5px 0}
#ruler button::before{border-radius:2px}
#ruler button.on{color:var(--ink);font-weight:600}
#ruler button.on::before{height:2px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.zoomctl{width:44px;padding:7px 0;gap:8px}
.zoomctl button{width:32px;height:32px;transition:background .2s,transform .35s var(--spring)}
.zoomctl button:hover{color:var(--ink);background:var(--hover);transform:scale(1.1)}

/* photo viewer: the print lifts off, tilts under the pointer, and its colours spill onto the frosted room behind */
#detail.open .scrim{background:rgba(5,6,10,.58);-webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%)}
[data-theme=light] #detail.open .scrim{background:rgba(250,236,226,.6)}
#dGlow{position:fixed;border-radius:60px;background-size:cover;background-position:center;filter:blur(72px) saturate(1.9);opacity:0;transform:scale(1.14);transition:opacity .9s .15s;pointer-events:none}
#detail.open #dGlow{opacity:.6}
[data-theme=light] #detail.open #dGlow{opacity:.5}
.dtilt{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s ease-out}
.face{border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#fffefb,#f5eee2);
  box-shadow:0 50px 100px -20px rgba(0,0,0,.6),0 30px 60px -30px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.7)}
[data-theme=light] .face{box-shadow:0 50px 90px -24px rgba(120,66,40,.42),0 24px 50px -28px rgba(120,66,40,.4),inset 0 0 0 1px #fff}
.face.front .photo{position:relative;border-radius:7px;background:#1c1a18}
.face.front .photo::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),inset 0 2px 12px rgba(0,0,0,.2)}
.face.front::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
  background:radial-gradient(70% 55% at var(--gx,22%) var(--gy,0%),rgba(255,255,255,.75),transparent 70%),linear-gradient(118deg,rgba(255,255,255,.3),transparent 32%)}
.face.back{padding:34px 36px 28px;background:repeating-linear-gradient(180deg,transparent 0 33px,rgba(120,90,60,.1) 33px 34px),linear-gradient(160deg,#fffefb,#f5eee2)}
.dmeta{font-weight:600}
.dtags span{font-family:var(--sans);background:rgba(138,106,69,.08);border-color:rgba(138,106,69,.2)}
.dnav{left:50%;right:auto;bottom:26px;width:max-content;max-width:calc(100vw - 20px);padding:5px;gap:2px;flex-wrap:nowrap;align-items:center;border-radius:999px;
  transform:translate(-50%,16px);transition:opacity .5s .2s,transform .7s .2s var(--spring)}
#detail.open .dnav{transform:translate(-50%,0)}
.dnav .chip{height:38px;padding:0 14px;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.dnav .chip::before,.dnav .chip::after{display:none}
.dnav .chip:hover{background:var(--hover);transform:none;filter:none}
.dnav .cnt{font-family:var(--sans);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.06em;color:var(--muted);padding:0 12px;white-space:nowrap}
.dnav .sep{width:1px;height:18px;background:var(--line);flex:none}

/* book of answers / gesture guide */
.bk-ask input{height:54px;padding:0 26px;border-radius:999px;color:var(--ink)}
.bk-ask input::placeholder{font-family:var(--sans);color:var(--faint)}
.bk-ask input:focus{box-shadow:var(--g-drop),var(--g-in),0 0 0 1.5px var(--gold-dim)}
.g-box{border-radius:36px;padding:38px 30px 26px;--ss:380px;--spec:rgba(255,255,255,.08)}
.g-ic{border:0;border-radius:24px;filter:none;background:linear-gradient(180deg,var(--g-a),var(--g-b));box-shadow:var(--g-in),inset 0 0 0 1px var(--g-mid)}
#gcam{border:0;border-radius:22px;box-shadow:var(--g-drop),0 0 0 1px var(--g-lo)}

/* ---------- 回忆 (light): golden-hour sky — sun, slow beams, soft bokeh, falling petals ---------- */
#sky .base{inset:-6%;background:
  radial-gradient(60% 46% at 86% 2%,#fffaf0 0%,rgba(255,232,190,.95) 20%,rgba(255,206,166,.5) 48%,rgba(255,206,166,0) 100%),
  linear-gradient(180deg,#b9c6ef 0%,#d9c9ea 24%,#f6cfd0 50%,#ffd6b4 76%,#ffe3bd 100%)}
#sky .blob{opacity:.5;filter:blur(70px)}
#sky .rays{position:absolute;left:86%;top:2%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;mix-blend-mode:soft-light;opacity:.9;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(255,250,232,.85) 3deg,rgba(255,255,255,0) 8deg,rgba(255,255,255,0) 13deg),

  lrTrack.style.setProperty('--t', Math.min(1, t*1.4).toFixed(3)); lrTrack.style.setProperty('--fw', (LR.x + 59) + 'px');

// at the end of the track the plane lifts off the knob and swoops into the vortex in the middle of the screen
function flyPlane(){
  LR.busy = true; lrHint.textContent = '出 发';
  lrTrack.style.setProperty('--to', '1');
  const r = lrPlane.getBoundingClientRect(), x0 = r.left + r.width/2, y0 = r.top + r.height/2;
  const fly = document.createElement('div'); fly.className = 'lr-fly'; fly.innerHTML = lrPlane.innerHTML; document.body.appendChild(fly);
  lrPlane.style.opacity = '0';
  const cx = innerWidth/2, cy = innerHeight*.42;
  const P = [[x0,y0],[x0 + innerWidth*.22, y0 - 30],[cx + innerWidth*.28, cy - innerHeight*.42],[cx, cy]];
  const bz = (k, i) => { const u = 1-k; return u*u*u*P[0][i] + 3*u*u*k*P[1][i] + 3*u*k*k*P[2][i] + k*k*k*P[3][i]; };
  const pr = {k:0}; let last = 0, launched = false;
  gsap.to(pr, {k:1, duration:1.25, ease:'power1.in', onUpdate(){
    const k = pr.k, x = bz(k,0), y = bz(k,1), k2 = Math.min(1, k + .01), ang = Math.atan2(bz(k2,1) - y, bz(k2,0) - x)*180/Math.PI;
    const sc = lerp(1, .06, Math.pow(k, 1.6));
    fly.style.transform = `translate(${x}px,${y}px) rotate(${ang + 21}deg) scale(${sc})`; fly.style.opacity = k > .85 ? (1 - k)/.15 : 1;
    const now = performance.now();
    if(now - last > 22 && k < .9){ last = now; const d = document.createElement('i'); d.className = 'lr-dot'; d.style.transform = `translate(${x}px,${y}px) scale(${sc*1.2 + .2})`; document.body.appendChild(d);
      d.animate([{opacity:.9},{opacity:0, transform:`translate(${x}px,${y + 6}px) scale(.2)`}], {duration:700, easing:'ease-out', fill:'forwards'}).onfinish = () => d.remove(); }
    if(!launched && k > .3){ launched = true; launch(); }
  }, onComplete(){ fly.remove(); }});
}
function resetLauncher(){ LR.busy = false; LR.drag = false; lrPlane.style.opacity = ''; lrHint.textContent = '向右滑动 · 启程'; lrGeo(); LR.x = LR.min; lrRender(); }
function launch(){
  if(mode!=='intro') return;
  mode = 'launch'; playWhoosh(); startMusic();
  $('#intro').classList.add('warping');
  $('#clockLabel').textContent = '正 在 穿 越';
  const from = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate()).getTime();
  const to = new Date(EARLIEST.y, (EARLIEST.m || 1)-1, EARLIEST.d || 1).getTime();
  const roll = {p:0}, tl = gsap.timeline(), Y = new THREE.Vector3(0,1,0), v = new THREE.Vector3();
  tl.to(orbit, {speed:2.2, duration:1.6, ease:'power2.in'}, 0);
  cards.forEach(c => {
    const start = c.anchor.clone(), pr = {k:0}, base = c.scale, twist = 2.4 + rand()*1.6;
    tl.to(pr, {k:1, duration:1.05, ease:'power3.in', onUpdate(){
      const k = pr.k; v.copy(start).sub(NC).applyAxisAngle(Y, k*twist).multiplyScalar(1-k);
      c.anchor.copy(NC).add(v); c.scale = base*(1 - k*.9);
    }}, .15 + rand()*.6);
  });
  tl.to(starMat.uniforms.suck, {value:.35, duration:1.6, ease:'power2.in'}, .1);
  tl.to(introDeco.children.map(s=>s.material), {opacity:0, duration:1}, .2);
  tl.to(core.material, {opacity:1, duration:.5}, 1.1);
  tl.to(core.scale, {x:12, y:12, duration:.8, ease:'power2.in'}, 1.1);
  tl.to(bloom, {strength:1.6, duration:1, ease:'power2.in'}, 1.0);
  tl.add(() => { warpLines.visible = true; cards.forEach(c => c.mesh.visible = false); }, 1.85);
  tl.to(warp, {dive:1, duration:.7, ease:'power2.in'}, 1.75);
  tl.to(core.material, {opacity:0, duration:.4}, 2.25);
  tl.to(warp, {speed:340, duration:1.0, ease:'power2.in'}, 1.85);
  tl.to(starMat.uniforms.suck, {value:0, duration:.2}, 1.9);
  tl.to(roll, {p:1, duration:2.6, ease:'power2.inOut', onUpdate(){ const d=new Date(from+(to-from)*roll.p); setClock(fmt(d.getFullYear(), d.getMonth()+1, d.getDate())); }}, 1.6);
  tl.to(warp, {speed:420, duration:1.2}, 2.85);
  tl.add(() => $('#flash').classList.add('on'), 3.95);
  tl.add(enterSpace, 4.35);
}
const dirOf = c => c.sphPos.clone().normalize();
function faceCard(c){ const d = dirOf(c); V.yaw = Math.atan2(d.x, -d.z); V.pitch = Math.asin(clamp(d.y, -1, 1)); }
// arrive inside the memories: every photo bursts out around you
function enterSpace(){
  mode = 'space';
  warpLines.visible = false; warp.speed = 0;
  introDeco.visible = false; core.visible = false; spaceDeco.visible = true;
  bloom.strength = baseBloom();
  // land in the middle of the ball, looking at the horizon
  const first = MEMS.reduce((b,c) => Math.abs(c.sphPos.y) < Math.abs(b.sphPos.y) ? c : b);
  faceCard(first); V.s = V.sT = first.j; V.E = 0;
  scene.fog.color.set(themeBg(0)); bgTarget.set(themeBg(0));
  const fwd = dirOf(first);
  cards.forEach(c => {
    c.mesh.visible = true; c.boom = 0;
    c.boomFrom = fwd.clone().multiplyScalar(2.5).add(new THREE.Vector3((rand()-.5)*1.2,(rand()-.5)*1.2,(rand()-.5)*1.2));
    c.boomQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(rand()*6, rand()*6, rand()*6));
    const delay = (1 - dirOf(c).dot(fwd))*.3 + rand()*.15;
    gsap.to(c, {boom:1, duration:2.2 + rand()*.5, ease:'expo.out', delay});
  });
  $('#intro').classList.add('gone'); setTimeout(()=>$('#intro').classList.add('hidden'), 500);
  const hud=$('#hud'); hud.classList.remove('hidden'); syncThumb(); requestAnimationFrame(()=>hud.classList.add('show'));
  setTimeout(() => { const f=$('#flash'); f.style.transition='opacity 1.8s ease-out'; f.classList.remove('on'); }, 80);
  canvas.style.cursor='grab';
}
// back to the start page: fade out, gather every photo back into the nebula, fade in

function playWhoosh(){
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)(), dur=4.6;
    const buf = ac.createBuffer(1, ac.sampleRate*dur, ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=ac.createBufferSource(); src.buffer=buf;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2;
    const g=ac.createGain(), now=ac.currentTime;
    bp.frequency.setValueAtTime(120,now); bp.frequency.exponentialRampToValueAtTime(900,now+1.8); bp.frequency.exponentialRampToValueAtTime(3200,now+3.6); bp.frequency.exponentialRampToValueAtTime(260,now+dur);
    g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.12,now+1.6); g.gain.exponentialRampToValueAtTime(.3,now+3.7); g.gain.exponentialRampToValueAtTime(.0001,now+dur);
    const o=ac.createOscillator(), og=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(55,now); o.frequency.exponentialRampToValueAtTime(30,now+dur);
    og.gain.setValueAtTime(.0001,now); og.gain.exponentialRampToValueAtTime(.25,now+3.5); og.gain.exponentialRampToValueAtTime(.0001,now+dur);
    src.connect(bp).connect(g).connect(ac.destination); o.connect(og).connect(ac.destination); src.start(); o.start(); o.stop(now+dur);
    setTimeout(()=>ac.close(), (dur+.5)*1000);
  }catch(e){}
}

addEventListener('resize', syncThumb);
function animateE(target, dur){
  if(zoomTween) zoomTween.kill();

}
function lookedAtCard(){
  const yw = V.yaw, pt = V.pitch, d = new THREE.Vector3(Math.cos(pt)*Math.sin(yw), Math.sin(pt), -Math.cos(pt)*Math.cos(yw));
  return SEQ.reduce((b,c) => dirOf(c).dot(d) > dirOf(b).dot(d) ? c : b);
}
function toHelix(c){
  if(mode!=='space') return;
  V.dollyT = 0;
  if(V.E < .02) V.psi = V.yaw;
  if(V.E < .02){ const f = c || lookedAtCard(); V.s = V.sT = sOf(f); }
  else if(c) V.sT = sOf(c);

}
function toPano(){

}
function setZoom(z){

function toggleView(){ viewMode === 'helix' ? toPano() : toHelix(); }

function panoYear(y){
  const c = MEMS[memFirst[y]], d = dirOf(c);
  const yaw = Math.atan2(d.x, -d.z), dyaw = Math.atan2(Math.sin(yaw - V.yaw), Math.cos(yaw - V.yaw));
  V.yawV = V.pitchV = 0; V.hlYear = y; setYear(y); $('#hud').classList.add('hl');
  gsap.to(V, {yaw:V.yaw + dyaw, pitch:Math.asin(clamp(d.y,-1,1))*(V.dollyT > .5 ? .6 : 1), duration:1.4, ease:'power2.inOut'});
}

let snapTimer = 0;
const snapSoon = () => { clearTimeout(snapTimer); snapTimer = setTimeout(() => { V.sT = clamp(Math.round(V.sT), 0, NJ-1); }, 200); };
addEventListener('wheel', e => {
  if(mode!=='space' || overlayOpen) return;
  e.preventDefault();
  if(e.ctrlKey && viewMode === 'helix' && V.E > .98){ setZoom(V.zoomT*(1 + e.deltaY*.012)); return; }   // close view: pinch = bring the tower nearer / send it back
  if(e.ctrlKey){                                   // trackpad pinch in the panorama: only step back / come back to the centre
    if(viewMode === 'pano' && V.E < .02) V.dollyT = clamp(V.dollyT + e.deltaY*.01, 0, 1);
    return;
  }
  if(viewMode === 'pano'){ V.dollyT = clamp(V.dollyT + e.deltaY*.0022, 0, 1); if(Math.abs(e.deltaX) > 2) V.yawV += e.deltaX*.0003; return; }
  V.sT = clamp(V.sT + (e.deltaY - e.deltaX)*.0045, 0, NJ-1); snapSoon();
}, {passive:false});
const drag = {active:false, sx:0, sy:0, lx:0, ly:0, vx:0};
canvas.addEventListener('pointerdown', e => { drag.active=true; drag.sx=drag.lx=e.clientX; drag.sy=drag.ly=e.clientY; if(mode==='space') canvas.style.cursor='grabbing'; });
addEventListener('pointermove', e => {
  mouse.x = (e.clientX/innerWidth)*2-1; mouse.y = -(e.clientY/innerHeight)*2+1; ndc.set(mouse.x, mouse.y);
  if(!drag.active) return;
  const dx = e.clientX-drag.lx, dy = e.clientY-drag.ly; drag.lx=e.clientX; drag.ly=e.clientY;
  if(mode==='intro'){ drag.vx = -dx*.004; return; }
  if(mode!=='space' || overlayOpen) return;
  if(viewMode === 'pano'){ clearHl(); const sg = V.dolly > .5 ? -1 : 1;   // outside the ball the camera orbits, so the sense flips
    V.yaw -= sg*dx*.0035; V.pitch = clamp(V.pitch + sg*dy*.003, -1.25, 1.25); V.yawV = -sg*dx*.0008; V.pitchV = sg*dy*.0006; }
  else V.sT = clamp(V.sT + (dx - dy)*.012, 0, NJ-1);
});
addEventListener('pointerup', e => {
  if(!drag.active) return; drag.active=false;
  if(mode!=='space' || overlayOpen) return;
  canvas.style.cursor = hovered ? 'pointer' : 'grab';
  if(Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) > 6){ if(viewMode==='helix') snapSoon(); return; }
  if(e.target === canvas) handleCanvasClick(e.clientX, e.clientY);
});
// click any photo in either view = enlarge it
function handleCanvasClick(x, y){
  if(mode!=='space' || overlayOpen) return;
  ndc.set((x/innerWidth)*2-1, -(y/innerHeight)*2+1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(meshes,false)[0];
  if(!hit) return;
  const c = hit.object.userData.c;
  if(viewMode === 'helix') V.sT = sOf(c);
  openDetail(c, src3D(c));
}
addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') { if(e.key==='Enter') $('#bkGo').click(); return; }
  if(e.key==='Escape'){ if(!$('#detail').classList.contains('hidden')) closeDetail(); else if(bookOpen) closeBook(); else if(viewMode==='helix') toPano(); return; }
  if(mode==='intro' && e.key==='Enter'){ firePlane(); return; }
  if(mode!=='space') return;
  if(!$('#detail').classList.contains('hidden')){
    if(e.key==='ArrowLeft') $('#dPrev').click(); if(e.key==='ArrowRight') $('#dNext').click();
    if(e.key===' '){ e.preventDefault(); dcard.onclick(); } return;
  }
  if(overlayOpen) return;
  if(e.key==='z'||e.key==='Z'){ toggleView(); return; }
  if(viewMode === 'helix' && (e.key==='-'||e.key==='_')){ setZoom(V.zoomT*1.25); return; }
  if(viewMode === 'helix' && (e.key==='='||e.key==='+')){ setZoom(V.zoomT/1.25); return; }
  if(viewMode === 'pano'){
    if(e.key==='ArrowLeft') V.yawV -= .02; if(e.key==='ArrowRight') V.yawV += .02;
    if(e.key==='ArrowUp') V.pitchV += .015; if(e.key==='ArrowDown') V.pitchV -= .015;
    if(e.key==='Enter') toHelix();
    return;
  }
  if(e.key==='ArrowDown'||e.key==='ArrowRight') V.sT = clamp(Math.round(V.sT)+1, 0, NJ-1);
  if(e.key==='ArrowUp'||e.key==='ArrowLeft') V.sT = clamp(Math.round(V.sT)-1, 0, NJ-1);
  if(e.key==='Enter' && curFocus) openDetail(curFocus, src3D(curFocus));
});

const dcard=$('#dcard'), detail=$('#detail');
let cur=null, cardBox={w:0,h:0,left:0,top:0};
function src3D(c){
  return { kind:'3d',
    rect(){ c.mesh.updateMatrixWorld(); const box=new THREE.Box3().copy(c.mesh.geometry.boundingBox).applyMatrix4(c.mesh.matrixWorld), v=new THREE.Vector3(); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
      for(const X of [box.min.x,box.max.x]) for(const Yy of [box.min.y,box.max.y]) for(const Z of [box.min.z,box.max.z]){
        v.set(X,Yy,Z).project(camera); const sx=(v.x+1)/2*innerWidth, sy=(1-v.y)/2*innerHeight;
        x0=Math.min(x0,sx); x1=Math.max(x1,sx); y0=Math.min(y0,sy); y1=Math.max(y1,sy); }
      return {left:x0, top:y0, width:x1-x0, height:y1-y0}; },
    hide(){ c.mesh.visible=false; }, show(){ c.mesh.visible=true; } };
}
function layoutCard(c){
  const vw=innerWidth, vh=innerHeight, ar=c.portrait?4/3:3/4, maxH=vh-150;
  let pw=Math.min(c.portrait?420:600, vw*.88-36); if(pw*ar+88>maxH) pw=(maxH-88)/ar;
  const w=pw+36, h=pw*ar+88; cardBox={w,h,left:(vw-w)/2,top:Math.max(16,(vh-h)/2-28)};
  Object.assign(dcard.style,{width:w+'px',height:h+'px',left:cardBox.left+'px',top:cardBox.top+'px'}); $('#dPhoto').style.height=pw*ar+'px';

    h += `<div class="blob" style="background:${c};left:${l};top:${t};width:${w}vw;height:${w}vw;--mx:${(i%2?-1:1)*6}vw;--my:${(i%3-1)*5}vh;animation-delay:${-i*4}s"></div>`);
  for(let i=0;i<22;i++){ const sz = 10 + Math.random()*46;
    h += `<div class="bokeh" style="left:${Math.random()*100}%;top:${30+Math.random()*75}%;width:${sz}px;height:${sz}px;--o:${(.25+Math.random()*.45).toFixed(2)};animation-duration:${14+Math.random()*16}s;animation-delay:${-Math.random()*30}s;filter:blur(${Math.random()<.4?2:0}px)"></div>`; }
  for(let i=0;i<14;i++){ const sz = 9 + Math.random()*13;
    h += `<div class="petal" style="left:${Math.random()*100}%;--s:${sz.toFixed(0)}px;--o:${(.5+Math.random()*.4).toFixed(2)};--sw:${((Math.random()-.5)*24).toFixed(1)}vw;--d:${(13+Math.random()*12).toFixed(1)}s;--dl:${(-Math.random()*25).toFixed(1)}s;filter:blur(${Math.random()<.35?1.5:0}px)"></div>`; }
  fx.innerHTML = h;
})();
// theme switch: the other theme spreads out from the button you pressed as a growing circle
function switchTheme(btn){
  const r = btn.getBoundingClientRect(), x = r.left + r.width/2, y = r.top + r.height/2;
  const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  btn.classList.add('spin'); setTimeout(() => btn.classList.remove('spin'), 50);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!document.startViewTransition || reduce){
    const f = $('#fade'); f.style.background = isLight ? '#060508' : '#f6e3d6'; f.classList.add('on');
    setTimeout(() => { applyTheme(!isLight); f.classList.remove('on'); setTimeout(() => f.style.background = '', 600); }, 450);
    return;
  }
  const vt = document.startViewTransition(() => applyTheme(!isLight));
  vt.ready.then(() => document.documentElement.animate(
    {clipPath:[`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`]},
    {duration:1100, easing:'cubic-bezier(.65,0,.25,1)', pseudoElement:'::view-transition-new(root)'})).catch(() => {});
}
$('#btnTheme').onclick = e => switchTheme(e.currentTarget); $('#btnThemeIntro').onclick = e => switchTheme(e.currentTarget);
applyTheme(isLight);

/* ======================= MUSIC ======================= */
// tracks come from music/playlist.json (made by scripts/set_music.py); ＋ in the player can add more for this session
const PL = await fetch('music/playlist.json', {cache:'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null);
const PLAYLIST = (PL && Array.isArray(PL.tracks) ? PL.tracks : []).map(t => ({title:'', src:(t && /^https:\/\//.test(t.url || '')) ? t.url : 'music/' + (t.file || t), bad:false}));   // url = 发布时单独上传的音乐
const audio = new Audio(); audio.preload = 'auto';
if(location.search.includes('debug')) window.__audio = audio;
const VOL = .55;
let track = 0, musicStarted = false, wantPlay = false, fadeTimer = 0, failStreak = 0, playId = 0, handledId = -1, exhausted = false;
const player = $('#player'), pTitle = $('#pTitle'), pIcon = $('#pIcon');
function fadeTo(target, sec){
  return new Promise(res => {
    clearInterval(fadeTimer);
    const from = audio.volume, t0 = performance.now(), ms = Math.max(1, sec*1000);
    fadeTimer = setInterval(() => {   // a timer (not rAF) so the fade keeps going in a background tab
      const k = Math.min(1, (performance.now() - t0)/ms), e = k*k*(3 - 2*k);
      audio.volume = clamp(from + (target - from)*e, 0, 1);
      if(k >= 1){ clearInterval(fadeTimer); res(); }
    }, 30);
  });
}
function showTrack(){
  if(exhausted){ $('#pPlay').title = '没有找到可播放的音乐，点 ＋ 添加'; player.classList.remove('playing'); pIcon.setAttribute('d', 'M8 5v14l11-7z'); return; }
  const t = PLAYLIST[track];
  pTitle.textContent = t ? t.title : '音乐';
  pTitle.classList.toggle('miss', !t || t.bad);
  player.classList.toggle('playing', !audio.paused && wantPlay);
  pIcon.setAttribute('d', wantPlay ? 'M7 5h4v14H7zM13 5h4v14h-4z' : 'M8 5v14l11-7z');
}
async function playTrack(i, fadeIn){
  if(!PLAYLIST.length) return;
  track = (i + PLAYLIST.length) % PLAYLIST.length;
  const id = ++playId; exhausted = false;
  audio.src = PLAYLIST[track].src; audio.volume = 0; wantPlay = true; showTrack();
  try{ await audio.play(); if(id !== playId) return; failStreak = 0; PLAYLIST[track].bad = false; fadeTo(VOL, fadeIn); }
  catch(e){ if(e.name !== 'AbortError') onTrackError(id); }
  showTrack();
}
// one failure per attempt (the error event and the rejected play() both report the same broken file)
function onTrackError(id){
  if(id !== playId || handledId === id) return;
  handledId = id; PLAYLIST[track].bad = true;
  if(++failStreak >= PLAYLIST.length){ exhausted = true; wantPlay = false; showTrack(); return; }   // nothing playable yet
  playTrack(nextRandom(), 2.5);
}
audio.addEventListener('error', () => { if(wantPlay) onTrackError(playId); });
audio.addEventListener('ended', () => playTrack(nextRandom(), 3));
audio.addEventListener('play', showTrack); audio.addEventListener('pause', showTrack);
// starts with the time machine — very quietly, swelling up over ~8 seconds
// shuffle bag: random order, nothing repeats until every song has played, and a new round never starts with the song just heard
let bag = [];
function nextRandom(){
  if(!bag.length){
    bag = PLAYLIST.map((_, i) => i);
    for(let i = bag.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    if(bag.length > 1 && bag[0] === track && musicStarted) bag.push(bag.shift());
  }
  return bag.shift();
}
function startMusic(){ if(musicStarted || !PLAYLIST.length){ if(!PLAYLIST.length) $('#pPlay').title = '还没有音乐，点 ＋ 添加'; return; } failStreak = 0; const first = nextRandom(); musicStarted = true; playTrack(first, 8); }
$('#pPlay').onclick = async () => {
  if(!musicStarted){ startMusic(); return; }
  if(wantPlay){ wantPlay = false; showTrack(); await fadeTo(0, .8); if(!wantPlay) audio.pause(); showTrack(); }
  else { wantPlay = true; failStreak = 0; if(exhausted || PLAYLIST[track].bad) return playTrack(nextRandom(), 2); try{ await audio.play(); }catch(e){} fadeTo(VOL, 1.8); showTrack(); }
};
$('#pNext').onclick = async () => {
  if(!musicStarted){ startMusic(); return; }
  await fadeTo(0, .6); failStreak = 0; playTrack(nextRandom(), 2.4);
};
$('#pFiles').onchange = e => {
  const files = [...e.target.files].sort((a,b) => a.name.localeCompare(b.name, 'zh'));
  if(!files.length) return;
  PLAYLIST.splice(0, PLAYLIST.length, ...files.map(f => ({title:'', src:URL.createObjectURL(f), bad:false})));
  musicStarted = true; failStreak = 0; bag = []; playTrack(nextRandom(), 4); e.target.value = '';
};
showTrack();

tick();
</script>
